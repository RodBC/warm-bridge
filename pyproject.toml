[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warm-bridge"
version = "0.1.0"
description = "Target → bridges in your graph → scored paths + approach scripts. Playbook for warm sales intros."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Warm Bridge contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
warm-bridge = "warm_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
