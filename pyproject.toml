[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warm-bridge"
version = "0.2.0"
description = "Target → bridges in your graph → scored paths + approach scripts. Playbook for warm sales intros."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Warm Bridge contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
warm-bridge = "warm_bridge.cli:main"
warm-bridge-api = "warm_bridge.api:run"

[tool.setuptools.packages.find]
where = ["src"]
