# Approach modes — when to use which template.

modes:
  ask_intro:
    label: Ask for warm intro
    when: high trust + clear path (same_company, mutual_hint, phone_warm, direct)
    include_blurb: true
  peer_forward:
    label: Ask bridge to forward a blurb
    when: medium trust; bridge won't call but will forward
    include_blurb: true
  ask_intel:
    label: Ask for org / buyer map
    when: path unclear; need who decides before asking intro
    include_blurb: false
  ask_permission:
    label: Soft permission / name-drop OK
    when: weak tie (alumni, stale, unknown strength)
    include_blurb: false

